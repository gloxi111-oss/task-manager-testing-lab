name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Ejecutar pruebas con cobertura
        run: npx jest --coverage --ci --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary

      - name: Verificar umbral de cobertura (mínimo 70%)
        run: |
          echo "El umbral global de 70% (branches, functions, lines, statements) está definido en jest.config.js"
          echo "Si la cobertura es inferior, el paso anterior falla automáticamente (exit code != 0)."

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14